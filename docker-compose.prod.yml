# =============================================================================
# PRODUCTION COMPOSE — hardened single-host deployment of the Laravel stack.
#
#   cp docker/.env.prod.example .env.prod   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Differences from the dev stack (docker-compose.yml):
#   - App runs from an immutable, non-root image built by CI (Dockerfile.prod).
#   - No phpMyAdmin / pgAdmin / RedisInsight / Mailpit / node+5173 / self-signed
#     self-bootstrap. No host ports for MySQL/Postgres/Redis.
#   - One-shot migrations run as a managed job, not in the foreground.
#   - Secrets come from env_file: .env.prod   (copy .env.prod.example).
#   - TLS certs are mounted read-only from ./docker/nginx/certs (paste real
#     certs, or terminate TLS at an ingress/CDN in front).
#   - Containers run read-only rootfs, non-root, no new privileges.
#
# The app image is referenced by tag (built/pushed from CI):
#   APP_IMAGE=registry.example.com/acme/laravel:1.2.3
# =============================================================================
name: laravel-prod

x-app-image: &app-image ${APP_IMAGE:-your-registry/laravel-app:latest}

x-app-service: &app-service
  image: *app-image
  env_file: .env.prod
  user: "33:33"
  read_only: true
  tmpfs:
    - /run
    - /var/log
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  mem_limit: ${APP_MEM_LIMIT:-512m}
  cpus: ${APP_CPUS:-1.0}
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  app:
    <<: *app-service
    volumes:
      - app_storage:/var/www/storage
    healthcheck:
      test: ["CMD", "php", "-r", "if (!@stream_socket_client('tcp://127.0.0.1:9000', $$e, $$s, 2)) exit(1);"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.31.5-alpine
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    init: true
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *app-service
    command: ["php", "artisan", "horizon"]
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot migration job — excluded from `up`, run explicitly:
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm migrate
  migrate:
    <<: *app-service
    profiles: ["jobs"]
    command: ["/bin/sh", "-c", "php artisan migrate --force && php artisan migrate --database=vector --force"]
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.4
    env_file: .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env.prod}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env.prod
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: ${VECTOR_DB_USERNAME}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USERNAME} -d vector"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-}
    env_file: .env.prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  postgres_data:
  redis_data: