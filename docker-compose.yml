services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - .:/var/www

  nginx:
    image: nginx:1.31.5-alpine

    ports:
      - "8080:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app