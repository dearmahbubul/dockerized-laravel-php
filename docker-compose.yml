# =============================================================================
# Laravel + MySQL + PostgreSQL(pgvector) + Redis + Nginx
# =============================================================================
#   docker compose up -d
#
# Primary app DB is chosen in .env via DB_CONNECTION. Both servers run always:
#   mysql     -> DB_CONNECTION=mysql   (default)
#   postgres  -> DB_CONNECTION=pgsql
# The Postgres 'vector' database (pgvector) is ALWAYS used for embeddings.
#
# Endpoints:
#   Site ........ http://localhost:8080
#   Horizon ..... http://localhost:8080/horizon
#   MailPit ..... http://localhost:8025
#   phpMyAdmin .. http://localhost:8081
#   pgAdmin ....... http://localhost:8082 (admin@example.com / admin)
#   RedisInsight  http://localhost:5540
#   MySQL ....... host port 3306
#   PostgreSQL .. host port 5433 (psql -h localhost -p 5433 -U laravel vector)
# =============================================================================
# Shared YAML anchors — single source of truth for values used by several
# services (change once, applies to all). Composes into: `services:`
# =============================================================================
x-php-environment: &php-environment
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: null
  REDIS_PORT: 6379
  TELESCOPE_ENABLED: "true"

x-php-depends: &php-depends
  mysql:
    condition: service_healthy
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  app:
    build: .
    environment:
      <<: *php-environment
    volumes:
      - app_code:/var/www
      - ./docker:/docker:ro
      - ./docker/nginx/certs:/opt/certs
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./docker/php/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    healthcheck:
      test: ["CMD", "php", "-r", "if (!@stream_socket_client('tcp://127.0.0.1:9000', $$e, $$s, 2)) exit(1);"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      <<: *php-depends
    restart: unless-stopped

  horizon:
    build: .
    environment:
      <<: *php-environment
    volumes:
      - app_code:/var/www
      - ./docker:/docker:ro
      - ./docker/worker-bootstrap.sh:/usr/local/bin/worker-bootstrap.sh:ro
      - ./docker/php/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    depends_on:
      app:
        condition: service_started
      <<: *php-depends
    entrypoint: ["worker-bootstrap.sh"]
    command: ["/bin/sh", "-c", "if [ -d /var/www/vendor/laravel/horizon ]; then exec php artisan horizon; else echo 'laravel/horizon not installed — horizon service disabled'; fi"]
    restart: unless-stopped

  scheduler:
    build: .
    environment:
      <<: *php-environment
    volumes:
      - app_code:/var/www
      - ./docker:/docker:ro
      - ./docker/worker-bootstrap.sh:/usr/local/bin/worker-bootstrap.sh:ro
      - ./docker/php/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    depends_on:
      app:
        condition: service_started
      <<: *php-depends
    entrypoint: ["worker-bootstrap.sh"]
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /var/www
    volumes:
      - app_code:/var/www
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy
    command: ["/bin/sh", "-c", "npm install --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund; exec npm run dev -- --host 0.0.0.0"]
    restart: unless-stopped

  nginx:
    image: nginx:1.31.5-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - app_code:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d vector"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight
    ports:
      - "5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_NAME: app-redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_code:
  mysql_data:
  redis_data:
  postgres_data:
