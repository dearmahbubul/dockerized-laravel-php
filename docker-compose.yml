services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - .:/var/www
      # Anonymous volume that keeps vendor/ in container-local storage:
      # (a) the bind mount would otherwise overlay the image-baked vendor with a
      #     host vendor/ (slow/stale), and (b) on first boot the entrypoint
      #     copies /opt/laravel's ~100k vendor files here instead of through the
      #     Windows bind mount (minutes -> seconds).
      - /var/www/vendor

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.31.5-alpine

    ports:
      - "8080:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mysql — primary database (data persisted in the mysql_data volume)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Exposed so the host test-suite (php artisan test) can reach it.
      # 33061 on the host -> 3306 in the container (avoids clashing with any
      # locally installed MySQL).
      - "33061:3306"
    healthcheck:
      # -proot: mysqladmin must authenticate or some setups report a false-
      # positive "alive" even while the server rejects connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # redis — cache, sessions and the queue backend that Horizon consumes
  # ---------------------------------------------------------------------------
  # A named volume makes queue jobs (pending notifications, failed-job history)
  # survive container recreation. Cache/session loss on upgrade is harmless;
  # losing queued jobs would not be.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # redisinsight — web UI for browsing Redis data
  # ---------------------------------------------------------------------------
  # The official Redis GUI (equivalent to phpMyAdmin for MySQL).
  #
  #   http://localhost:5540
  #
  # The RI_* variables preload a connection named "luxiworld-redis" pointing
  # at the redis service above — no manual setup inside the UI needed. You'll
  # find Laravel's data under key prefixes like luxiworld_cache_*, horizon:*,
  # luxiworld_sessions_*.
  # ---------------------------------------------------------------------------
  redisinsight:
    image: redis/redisinsight
    ports:
      - "5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_NAME: luxiworld-redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mailpit — catches every outgoing email locally
  # ---------------------------------------------------------------------------
  # Replacement for the archived MailHog project. SMTP on 1025 (Laravel's
  # MAIL_HOST target), inbox UI published below.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # scheduler — Laravel task scheduler ("cron job")
  # ---------------------------------------------------------------------------
  # Runs `php artisan schedule:work`, an every-minute loop that executes any
  # due tasks defined in routes/console.php (currently: horizon:snapshot and
  # telescope:prune). This replaces the classic host crontab entry
  # (`* * * * * php artisan schedule:run`) — no Windows Task Scheduler needed.
  #
  # Like the horizon service, it bypasses the bootstrap entrypoint because the
  # app container has already prepared .env / vendor / permissions.
  # ---------------------------------------------------------------------------
  scheduler:
    build: .
    environment:
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
    volumes:
      - ./:/var/www
      - /var/www/vendor
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["php artisan schedule:work"]
    restart: unless-stopped


volumes:
  mysql_data:
  redis_data: