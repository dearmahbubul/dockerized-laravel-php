; ======================================================================
; Custom PHP settings — bind-mounted into the PHP-FPM / CLI containers.
;
; This file is merged on top of the image defaults (loaded LAST), so just
; add/override the directives you care about. Change it and run:
;   docker compose restart app horizon scheduler
; Verify with:  docker compose exec app php -i | grep memory_limit
; ======================================================================

memory_limit = 256M

; File uploads
upload_max_filesize = 20M
post_max_size = 20M
max_file_uploads = 20

; Execution time
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; Error display (dev-friendly; switch display_errors=Off in production)
error_reporting = E_ALL
display_errors = On
log_errors = On

; Timezone (Laravel sets this via config/app.php 'timezone' — keep in sync)
date.timezone = UTC

; OPcache (production)
; opcache.memory_consumption = 128
; opcache.interned_strings_buffer = 8
; opcache.max_accelerated_files = 10000
; opcache.revalidate_freq = 2
; opcache.enable_cli = 0

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600